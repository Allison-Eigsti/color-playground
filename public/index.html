<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Palette</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="primary-heading">

        <button class="mobile-nav-toggle" aria-controls="primary-navigation" aria-expanded="false">
            <img class="hamburger-icon" src="assets/icons/hamburger-icon.png" aria-hidden="true" alt="open hamburger icon">
            <img class="close-icon hidden" src="assets/icons/close-menu-icon.png" aria-hidden="true" alt="close menu icon">
        </button>

        <nav class="primary-navigation" id="primary-navigation">
            <ul aria-label="Primary" role="list" class="nav-list">
                <li><a href="./playground.html">Color Playground</a></li>
                <li><a href="#">Create a Palette</a></li>
                <li><a href="./library.html">My Color Library</a></li>
            </ul>
        </nav>
    </header>

    <section class="main-graphic">
        <h1>
            <span class="a">CREATE YOUR OWN</span>
            <span class="b">COLOR PALETTES</span>
        </h1>
    </section>

    <main class="create">
        <section class="main-content column">
            <h2 class="center">Click a box to select a color...</h2>


            <form class="column main-content">
                <input type="text" name="title" id="title" placeholder="Palette Name" class="center">

                <div class="palette-wrapper">
                    <div class="box" id="color1">Color 1</div>
                        <input name="color1" type="color" id="colorPicker1" style="display: none;">
                    <div class="box" id="color2">Color 2</div>
                        <input name="color2" type="color" id="colorPicker2" style="display: none;">
                    <div class="box" id="color3">Color 3</div>
                        <input name="color3" type="color" id="colorPicker3" style="display: none;">
                    <div class="box" id="color4">Color 4</div>
                        <input name="color4" type="color" id="colorPicker4" style="display: none;">
                </div>
            
            <div class="btn-wrapper">
                <button type="submit" class="btn btn-accent-purple">Save to your Library</button>
            </div>

            </form>
             
        </section>

        <section>
            <p>Want to save your palettes to a personal library? Sign in here.</p>
            <form>
                <label for="email">Email: </label>
                <input type="email" name="email" id="email" placeholder="example@gmail.com" required autofocus>
                <label for="password">Password: </label>
                <input type="password" name="password" id="password" required>
                <button type="submit">Register</button>
            </form>
        </section>
    </main>

    <footer>Created by Allison Eigsti, updated 2026</footer>
    
    <script type="module" src="./js/index.js"></script>
</body>
</html>
